name: CI

# Every check of the package on each push to main and each pull request: typecheck, unit tests with
# the --json schemas and snapshots, the build, the built CLI against a fake API, the package exactly
# as npm would publish it, and the built CLI on Node 18 (the oldest supported version).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, build, built bin, package, Node 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests, --json schemas and snapshots (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Built bin (fake API, exit codes, Ctrl-C)
        run: npm run test:bin

      - name: Package check (tarball files, installed bin, npm exec storeshot)
        run: npm run check:package -- --keep

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Node 18 smoke (built bin)
        run: node --test test-dist/bin.test.mjs
